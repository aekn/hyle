name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: true

      - name: sync
        run: uv sync --locked --all-packages

      - name: format
        run: uv run ruff format --check .

      - name: lint
        run: uv run ruff check .

      - name: types
        run: uv run pyright

      - name: test
        run: uv run pytest

      - name: compile
        run: uv run python -m compileall -q packages examples scripts

      - name: build
        run: |
          uv build --no-sources --package hyle-core --out-dir dist
          uv build --no-sources --package hyle-ollama --out-dir dist

      - name: verify
        run: >-
          uv run python scripts/verify_distributions.py
          --package hyle-core
          --package hyle-ollama
          dist/*

      - name: wheel
        run: |
          uv venv /tmp/hyle-wheel --python 3.14
          uv pip install --python /tmp/hyle-wheel/bin/python dist/*.whl
          /tmp/hyle-wheel/bin/python scripts/smoke_imports.py

      - name: sdist
        run: |
          uv venv /tmp/hyle-sdist --python 3.14
          uv pip install --python /tmp/hyle-sdist/bin/python dist/*.tar.gz
          /tmp/hyle-sdist/bin/python scripts/smoke_imports.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: true

      - name: sync
        run: uv sync --locked --all-packages

      - name: test
        run: uv run pytest
