[project]
name = "hyle-ollama"
version = "0.1.0a1"
description = "Native Ollama integration for Hyle."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
import-names = ["hyle_ollama"]
dependencies = [
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "hyle-core==0.1.0a1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/aekn/hyle"
Documentation = "https://aekn.github.io/hyle/"
Issues = "https://github.com/aekn/hyle/issues"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hyle_ollama"
module-root = ""
source-include = ["tests/**"]

[tool.uv.sources]
hyle-core = { workspace = true }
